name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sm-tool/package-lock.json

      - name: Install CLI dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci
        working-directory: apps/sm-tool

      - name: Typecheck, test, and build
        run: npm run check
